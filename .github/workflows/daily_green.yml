name: Advanced Contribution Bot

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Randomized Contribution
        run: |
          NUM_COMMITS=$(( ( RANDOM % 11 )  + 10 ))
          echo "Өнөөдөр $NUM_COMMITS удаа өөрчлөлт оруулна..."

          for i in $(seq 1 $NUM_COMMITS)
          do
            echo "Entry $(date +'%Y-%m-%d %H:%M:%S') - Task $i completed" >> activity.log
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add activity.log
            git commit -m "chore: updates activity log - task $i [skip ci]"
          done

      - name: Push changes
        run: git push origin main
